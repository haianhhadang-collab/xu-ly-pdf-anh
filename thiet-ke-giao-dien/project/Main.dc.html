<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Hồ sơ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0A5F8F;text-decoration:none}a:hover{color:#074A70}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F6F8; color: #15202B; font-family: 'Be Vietnam Pro', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 8px">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 13px; color: #5A6672">Quét · làm sạch · PDF</span>
      <h1 style="margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.2px">Hồ sơ của tôi</h1>
    </div>
    <button aria-label="Tìm hồ sơ" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #DDE3E8; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#15202B" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
    </button>
  </header>

  <section style="padding: 12px 20px 4px; display: flex; flex-direction: column; gap: 10px">
    <a href="Camera.dc.html" style="display: flex; align-items: center; gap: 16px; padding: 18px; border-radius: 18px; background: #0A5F8F; color: #FFFFFF">
      <span style="width: 52px; height: 52px; border-radius: 14px; background: rgba(255,255,255,0.16); display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
      </span>
      <span style="display: flex; flex-direction: column; gap: 3px">
        <span style="font-size: 18px; font-weight: 600">Chụp tài liệu</span>
        <span style="font-size: 13px; color: #D6E8F2">Tự chụp khi trang đứng yên, rõ nét</span>
      </span>
    </a>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button style="display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 14px; border-radius: 16px; border: 1px solid #DDE3E8; background: #FFFFFF; font-family: inherit; color: #15202B; cursor: pointer; text-align: left">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0A5F8F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6v18h12V7z"></path><path d="M14 3v4h4"></path><path d="M12 11v6M9 14l3 3 3-3"></path></svg>
        <span style="font-size: 15px; font-weight: 600">Nhập ảnh, PDF</span>
        <span style="font-size: 12px; color: #5A6672">Từ thư viện ảnh, tệp</span>
      </button>
      <button style="display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 14px; border-radius: 16px; border: 1px solid #DDE3E8; background: #FFFFFF; font-family: inherit; color: #15202B; cursor: pointer; text-align: left">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0A5F8F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16v12H4z"></path><path d="M4 7l8 6 8-6"></path></svg>
        <span style="font-size: 15px; font-weight: 600">Tệp nhận được</span>
        <span style="font-size: 12px; color: #5A6672">Zalo, email chia sẻ sang</span>
      </button>
    </div>
  </section>

  <section style="flex: 1; min-height: 0; padding: 18px 20px 0; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <h2 style="margin: 0; font-size: 16px; font-weight: 600">Gần đây</h2>
      <span style="font-size: 13px; color: #5A6672">{{soHoSo}} hồ sơ</span>
    </div>
    <sc-for list="{{hoSo}}" as="h" hint-placeholder-count="4">
      <a href="Trang.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 12px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E6EAEE; color: #15202B">
        <span aria-hidden="true" style="width: 46px; height: 62px; border-radius: 6px; background: #FFFFFF; border: 1px solid #DDE3E8; box-shadow: 0 1px 2px rgba(21,32,43,0.08); display: flex; flex-direction: column; gap: 4px; padding: 8px 7px; box-sizing: border-box; flex-shrink: 0">
          <span style="height: 3px; width: 70%; background: #B9C2CA; border-radius: 2px"></span>
          <span style="height: 3px; width: 100%; background: #D3DAE0; border-radius: 2px"></span>
          <span style="height: 3px; width: 90%; background: #D3DAE0; border-radius: 2px"></span>
          <span style="height: 3px; width: 100%; background: #D3DAE0; border-radius: 2px"></span>
          <span style="height: 8px; width: 8px; margin-top: auto; margin-left: auto; border: 1.5px solid #C8443A; border-radius: 50%"></span>
        </span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{h.ten}}</span>
          <span style="font-size: 12px; color: #5A6672">{{h.meta}}</span>
          <sc-if value="{{h.dangXuLy}}" hint-placeholder-val="{{false}}">
            <span style="align-self: flex-start; font-size: 11px; font-weight: 600; color: #8A4B00; background: #FDF0DC; padding: 2px 8px; border-radius: 999px">{{h.trangThai}}</span>
          </sc-if>
        </span>
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8994A0" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"></path></svg>
      </a>
    </sc-for>
  </section>

  <nav aria-label="Điều hướng chính" style="display: flex; align-items: center; justify-content: space-around; height: 72px; background: #FFFFFF; border-top: 1px solid #E6EAEE; flex-shrink: 0">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 64px; color: #0A5F8F; font-size: 12px; font-weight: 600">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0A5F8F" stroke-width="2" stroke-linejoin="round"><path d="M4 5h6l2 2h8v12H4z"></path></svg>
      Hồ sơ
    </a>
    <a href="Camera.dc.html" aria-label="Chụp" style="width: 56px; height: 56px; border-radius: 28px; background: #0A5F8F; display: flex; align-items: center; justify-content: center; margin-top: -24px; box-shadow: 0 6px 16px rgba(10,95,143,0.35)">
      <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
    </a>
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 64px; color: #5A6672; font-size: 12px; font-weight: 500">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5A6672" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"></path></svg>
      Cài đặt
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const hoSo = [
      { ten: 'Công văn đề nghị số hóa tài liệu', meta: '3 trang · hôm nay · PDF có lớp chữ', dangXuLy: false },
      { ten: 'Sách: Lịch sử văn hóa – chương 3', meta: '24 trang · hôm nay', dangXuLy: true, trangThai: 'Đang xử lý 18/24' },
      { ten: 'Biên bản họp Hội đồng thư viện', meta: '5 trang · 27/10/2026 · PDF', dangXuLy: false },
      { ten: 'Quyết định giao nhiệm vụ', meta: '2 trang · 24/10/2026 · PDF', dangXuLy: false }
    ];
    return { hoSo, soHoSo: hoSo.length };
  }
}
</script>
</body>
</html>
