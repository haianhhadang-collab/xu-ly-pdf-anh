<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Xuất PDF</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0A5F8F;text-decoration:none}a:hover{color:#074A70}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F6F8; color: #15202B; font-family: 'Be Vietnam Pro', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="display: flex; align-items: center; gap: 8px; padding: 14px 12px 6px">
    <a href="Trang.dc.html" aria-label="Quay lại" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#15202B" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <h1 style="margin: 0; font-size: 18px; font-weight: 700">Xuất PDF</h1>
  </header>

  <div style="flex: 1; min-height: 0; padding: 8px 16px 0; display: flex; flex-direction: column; gap: 14px">
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #3B4752">
      Tên tệp
      <input type="text" value="Lich-su-van-hoa-chuong-3" style="height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #C9D2DA; background: #FFFFFF; font-family: inherit; font-size: 15px; color: #15202B; box-sizing: border-box">
    </label>

    <div style="padding: 14px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E6EAEE; display: flex; flex-direction: column; gap: 14px">
      <div role="group" aria-label="Khổ giấy" style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 13px; font-weight: 600; color: #3B4752">Khổ giấy</span>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
          <sc-for list="{{kho}}" as="k" hint-placeholder-count="4">
            <button aria-pressed="{{k.chon}}" onClick="{{k.pick}}" style="{{k.kieu}}">{{k.ten}}</button>
          </sc-for>
        </div>
      </div>
      <div role="group" aria-label="Chất lượng ảnh" style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 13px; font-weight: 600; color: #3B4752">Chất lượng ảnh</span>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
          <sc-for list="{{chatLuong}}" as="c" hint-placeholder-count="3">
            <button aria-pressed="{{c.chon}}" onClick="{{c.pick}}" style="{{c.kieu}}">
              <span style="display: block; font-size: 14px; font-weight: 600">{{c.ten}}</span>
              <span style="display: block; font-size: 11px; font-weight: 500; color: #5A6672">{{c.dpi}}</span>
            </button>
          </sc-for>
        </div>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between">
        <span style="font-size: 13px; font-weight: 600; color: #3B4752">Lề (mm)</span>
        <div style="display: flex; align-items: center; gap: 4px">
          <button aria-label="Giảm lề" style="width: 40px; height: 40px; border-radius: 12px; border: 1px solid #DDE3E8; background: #FFFFFF; font-size: 18px; color: #15202B; cursor: pointer">−</button>
          <span style="min-width: 36px; text-align: center; font-size: 15px; font-weight: 600">0</span>
          <button aria-label="Tăng lề" style="width: 40px; height: 40px; border-radius: 12px; border: 1px solid #DDE3E8; background: #FFFFFF; font-size: 18px; color: #15202B; cursor: pointer">+</button>
        </div>
      </div>
    </div>

    <div style="padding: 6px 14px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E6EAEE; display: flex; flex-direction: column">
      <sc-for list="{{tuyChon}}" as="o" hint-placeholder-count="2">
        <div style="display: flex; align-items: center; gap: 12px; min-height: 60px">
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 14px; font-weight: 600">{{o.ten}}</span>
            <span style="font-size: 12px; color: #5A6672">{{o.mo}}</span>
          </span>
          <button aria-pressed="{{o.bat}}" aria-label="{{o.ten}}" onClick="{{o.doi}}" style="{{o.congTac}}">
            <span style="width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF; display: block"></span>
          </button>
        </div>
      </sc-for>
    </div>

    <p style="margin: 0; display: flex; gap: 8px; align-items: flex-start; font-size: 12px; color: #5A6672">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5A6672" stroke-width="2" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px"><path d="M6 10V8a6 6 0 0 1 12 0v2"></path><path d="M5 10h14v10H5z"></path></svg>
      Mọi xử lý chạy trên máy, không gửi tài liệu đi đâu.
    </p>
  </div>

  <footer style="display: flex; gap: 10px; padding: 12px 16px 22px">
    <button style="flex: 1; height: 52px; border-radius: 14px; border: 1px solid #DDE3E8; background: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 600; color: #15202B; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#15202B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="2.5"></circle><circle cx="6" cy="12" r="2.5"></circle><circle cx="18" cy="19" r="2.5"></circle><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"></path></svg>
      Chia sẻ
    </button>
    <button style="flex: 1.4; height: 52px; border-radius: 14px; border: 0; background: #0A5F8F; font-family: inherit; font-size: 15px; font-weight: 600; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg>
      Lưu vào máy
    </button>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { kho: 'a4', cl: 'vua', ocr: true, txt: false };
  }
  renderVals() {
    const o = 'min-height: 44px; border-radius: 12px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; color: #15202B; ';
    const on = 'border: 1px solid #0A5F8F; background: #E3F0F7; ';
    const off = 'border: 1px solid #DDE3E8; background: #FFFFFF; ';
    const kho = [{ id: 'a4', ten: 'A4' }, { id: 'a5', ten: 'A5' }, { id: 'letter', ten: 'Letter' }, { id: 'anh', ten: 'Theo ảnh' }]
      .map((k) => ({ ...k, chon: this.state.kho === k.id, kieu: o + (this.state.kho === k.id ? on : off), pick: () => this.setState({ kho: k.id }) }));
    const chatLuong = [{ id: 'cao', ten: 'Cao', dpi: '300 dpi' }, { id: 'vua', ten: 'Vừa', dpi: '200 dpi' }, { id: 'nho', ten: 'Nhỏ', dpi: '150 dpi' }]
      .map((c) => ({ ...c, chon: this.state.cl === c.id, kieu: o + 'padding: 6px 0; ' + (this.state.cl === c.id ? on : off), pick: () => this.setState({ cl: c.id }) }));
    const sw = (b) => 'width: 52px; height: 32px; border-radius: 16px; border: 0; padding: 3px; cursor: pointer; display: flex; align-items: center; flex-shrink: 0; '
      + (b ? 'background: #0A5F8F; justify-content: flex-end' : 'background: #B4BEC7; justify-content: flex-start');
    const tuyChon = [
      { id: 'ocr', ten: 'Thêm lớp chữ', mo: 'Tìm kiếm, chép chữ trong PDF' },
      { id: 'txt', ten: 'Xuất kèm văn bản .txt', mo: 'Chữ nhận dạng được, tiếng Việt có dấu' }
    ].map((t) => ({ ...t, bat: this.state[t.id], congTac: sw(this.state[t.id]), doi: () => this.setState({ [t.id]: !this.state[t.id] }) }));
    return { kho, chatLuong, tuyChon };
  }
}
</script>
</body>
</html>
